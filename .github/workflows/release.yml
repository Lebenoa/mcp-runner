name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Test
        run: deno test -A tests/ --ignore=tests/browser_test.ts --ignore=tests/chatgpt_browser_test.ts

      - name: Build Chromium and Firefox targets
        run: deno task build

      - name: Package
        run: |
          cd .output
          zip -r ../mcp-runner-chrome.zip chrome-mv3
          zip -r ../mcp-runner-firefox.zip firefox-mv2

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-runner
          path: mcp-runner-*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" --clobber mcp-runner-*.zip
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes mcp-runner-*.zip
          fi
