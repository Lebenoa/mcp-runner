name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Build Chromium and Firefox targets
        run: deno task build

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd .output
          zip -r ../mcp-runner-chrome-linux-x86_64.zip chrome-mv3
          zip -r ../mcp-runner-firefox-linux-x86_64.zip firefox-mv2

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path .output/chrome-mv3 -DestinationPath mcp-runner-chrome-windows-x86_64.zip
          Compress-Archive -Path .output/firefox-mv2 -DestinationPath mcp-runner-firefox-windows-x86_64.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-runner-${{ matrix.os }}-x86_64
          path: mcp-runner-*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --clobber mcp-runner-*.zip
